<?xml version="1.0" encoding="UTF-8"?>
<!-- Lofts Studio — Wordmark (refined)
     Source Serif 4 Display italic with confident tracking.
     Below: "STUDIO" in tracked small caps — the premium signal. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" fill="none" aria-label="Lofts Studio">
  <text x="0" y="44"
        font-family="'Source Serif 4', 'Source Serif Pro', Georgia, serif"
        font-weight="500"
        font-style="italic"
        font-size="52"
        letter-spacing="-0.02em"
        fill="#1A1612">Lofts</text>
  <!-- Accent serif terminal -->
  <circle cx="142" cy="42" r="2.4" fill="#8B3A1F"/>
  <!-- Studio in tracked caps -->
  <text x="3" y="64"
        font-family="'Inter Tight', sans-serif"
        font-weight="500"
        font-size="10"
        letter-spacing="0.42em"
        fill="#6C6258">STUDIO</text>
</svg>
