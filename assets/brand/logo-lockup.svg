<?xml version="1.0" encoding="UTF-8"?>
<!-- Lofts Studio — Lockup (refined)
     Mark left, wordmark right with tracked caps. Hermès-grade restraint. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 72" fill="none" aria-label="Lofts Studio">
  <!-- Mark -->
  <rect x="1" y="6" width="60" height="60" rx="6" fill="#1A1612"/>
  <path d="M 22 21 L 22 47 L 44 47" stroke="#F4F0EA" stroke-width="2.2" stroke-linecap="square" fill="none"/>
  <circle cx="44" cy="47" r="1.9" fill="#8B3A1F"/>
  <line x1="19" y1="53" x2="48" y2="53" stroke="#F4F0EA" stroke-width="0.6" opacity="0.25"/>

  <!-- Wordmark -->
  <text x="80" y="44"
        font-family="'Instrument Sans', system-ui, sans-serif"
        font-weight="500"
        font-style="italic"
        font-size="38"
        letter-spacing="-0.02em"
        fill="#1A1612">Lofts</text>
  <text x="82" y="62"
        font-family="'Instrument Sans', system-ui, sans-serif"
        font-weight="500"
        font-size="9"
        letter-spacing="0.42em"
        fill="#6C6258">STUDIO</text>
</svg>
