<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F0EA"/>

  <!-- Subtle warm gradient overlay -->
  <defs>
    <radialGradient id="g" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ECE7DE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F4F0EA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- Top bar: tiny meta -->
  <text x="80" y="80" font-family="'Instrument Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#6C6258" letter-spacing="4">
    ADNAN K. &nbsp;·&nbsp; SENIOR STUDIO &nbsp;·&nbsp; ALMOST 15 YEARS
  </text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="'Instrument Sans', system-ui, sans-serif" font-size="88" font-weight="500" fill="#1A1612" letter-spacing="-2.5">Almost 15 years.</text>
  <text x="80" y="340" font-family="'Instrument Sans', system-ui, sans-serif" font-size="88" font-weight="500" fill="#1A1612" letter-spacing="-2.5">1,500+ projects handled.</text>
  <text x="80" y="440" font-family="'Instrument Sans', system-ui, sans-serif" font-style="italic" font-size="80" font-weight="400" fill="#2A241E" letter-spacing="-2">Senior hands. Direct answers.</text>

  <!-- Bottom row: stats -->
  <g transform="translate(80 540)">
    <text x="0" y="0" font-family="'Instrument Sans', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">1,500+</text>
    <text x="0" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">PROJECTS HANDLED</text>

    <text x="260" y="0" font-family="'Instrument Sans', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">900+</text>
    <text x="260" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">FIVE-STAR REVIEWS</text>

    <text x="560" y="0" font-family="'Instrument Sans', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">15</text>
    <text x="560" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">YEARS DELIVERY</text>

    <text x="860" y="0" font-family="'Instrument Sans', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">Top Rated</text>
    <text x="860" y="32" font-family="'Instrument Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">TWO UPWORK PROFILES</text>
  </g>

  <!-- Terracotta accent dot in corner -->
  <circle cx="1120" cy="80" r="6" fill="#8B3A1F"/>
</svg>
