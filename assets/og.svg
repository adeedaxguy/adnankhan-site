<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#F4F0EA"/>

  <!-- Subtle warm gradient overlay -->
  <defs>
    <radialGradient id="g" cx="20%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ECE7DE" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#F4F0EA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#g)"/>

  <!-- Top bar: tiny meta -->
  <text x="80" y="80" font-family="'Inter Tight', system-ui, sans-serif" font-size="20" font-weight="500" fill="#6C6258" letter-spacing="4">
    ADNAN K. &nbsp;·&nbsp; SENIOR STUDIO &nbsp;·&nbsp; ALMOST 15 YEARS
  </text>

  <!-- Main headline -->
  <text x="80" y="240" font-family="'Inter Tight', system-ui, sans-serif" font-size="88" font-weight="500" fill="#1A1612" letter-spacing="-2.5">Almost 15 years.</text>
  <text x="80" y="340" font-family="'Inter Tight', system-ui, sans-serif" font-size="88" font-weight="500" fill="#1A1612" letter-spacing="-2.5">Three hundred and seven stores.</text>
  <text x="80" y="440" font-family="'Source Serif 4', Georgia, serif" font-style="italic" font-size="80" font-weight="400" fill="#2A241E" letter-spacing="-2">One operator who answers his own email.</text>

  <!-- Bottom row: stats -->
  <g transform="translate(80 540)">
    <text x="0" y="0" font-family="'Inter Tight', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">307</text>
    <text x="0" y="32" font-family="'Inter Tight', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">STORES SHIPPED</text>

    <text x="260" y="0" font-family="'Inter Tight', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">$300K<tspan font-size="24">+</tspan></text>
    <text x="260" y="32" font-family="'Inter Tight', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">REVENUE MOVED</text>

    <text x="560" y="0" font-family="'Inter Tight', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">100<tspan font-size="24">%</tspan></text>
    <text x="560" y="32" font-family="'Inter Tight', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">JOB SUCCESS, 9 YRS</text>

    <text x="860" y="0" font-family="'Inter Tight', system-ui, sans-serif" font-size="44" font-weight="500" fill="#1A1612" letter-spacing="-1.5">5.0<tspan font-size="28" fill="#8B3A1F">&#9733;</tspan></text>
    <text x="860" y="32" font-family="'Inter Tight', system-ui, sans-serif" font-size="14" font-weight="500" fill="#6C6258" letter-spacing="2.5">ACROSS 298 REVIEWS</text>
  </g>

  <!-- Terracotta accent dot in corner -->
  <circle cx="1120" cy="80" r="6" fill="#8B3A1F"/>
</svg>
