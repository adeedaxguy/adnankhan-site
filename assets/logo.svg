<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" role="img" aria-label="Adnan K. — Studio">
  <defs>
    <linearGradient id="ak-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1612"/>
      <stop offset="1" stop-color="#8B3A1F"/>
    </linearGradient>
  </defs>
  <!-- Monogram mark: stylized A inside circle -->
  <g transform="translate(4 4)">
    <circle cx="28" cy="28" r="27" fill="none" stroke="#1A1612" stroke-width="1.4"/>
    <!-- A glyph -->
    <path d="M16 42 L28 14 L40 42 M21 33 L35 33" fill="none" stroke="#1A1612" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- tiny terracotta serif tick -->
    <circle cx="44" cy="44" r="2" fill="#8B3A1F"/>
  </g>
  <!-- Wordmark -->
  <g font-family="'Instrument Sans', system-ui, sans-serif" font-size="22" fill="#1A1612">
    <text x="72" y="36" font-style="italic" font-weight="400" letter-spacing="-0.5">Adnan</text>
    <text x="146" y="36" font-weight="500" letter-spacing="-0.3">K<tspan fill="#8B3A1F">.</tspan></text>
  </g>
  <!-- Tagline rule -->
  <text x="72" y="52" font-family="'Instrument Sans', system-ui, sans-serif" font-size="7.5" letter-spacing="2.6" fill="#6C6258" text-transform="uppercase">SENIOR&#8201;·&#8201;STUDIO&#8201;·&#8201;15&#8201;YRS</text>
</svg>
