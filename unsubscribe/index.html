<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script data-lofts-theme-init>(function(){var m="light";try{m=localStorage.getItem("lofts-theme")==="dark"?"dark":"light"}catch(e){}document.documentElement.dataset.theme=m;document.documentElement.style.colorScheme=m}())</script>
  <meta name="robots" content="noindex,nofollow" />
  <title>Stop Follow-ups | Lofts Studio</title>
<link rel="stylesheet" href="/assets/styles.css?v=20260808k" />
<link rel="stylesheet" href="/assets/experience.css?v=20260810b" data-lofts-experience />
<link rel="stylesheet" href="/assets/typography.css" />
<link rel="stylesheet" href="/assets/design-system.css?v=20260810b" />
</head>
<body class="unsubscribe-page">
<a class="skip-link" href="#main-content">Skip to main content</a>
  <main class="unsubscribe-panel" id="main-content" tabindex="-1">
    <a href="/" class="booking-brand">Lofts Studio</a>
    <p class="booking-kicker">Email preferences</p>
    <h1>Stop enquiry follow-ups?</h1>
    <p id="unsubscribe-copy">This stops future automated follow-ups about this enquiry. You can still email Lofts Studio whenever you need help.</p>
    <button id="unsubscribe-button" type="button">Stop follow-ups</button>
    <p class="booking-form-error" id="unsubscribe-error" role="alert"></p>
  </main>
  <script>
    const token = new URLSearchParams(window.location.search).get('t') || '';
    const button = document.getElementById('unsubscribe-button');
    if (!token) {
      button.disabled = true;
      document.getElementById('unsubscribe-error').textContent = 'This unsubscribe link is invalid. Reply to the email with “unsubscribe” and the team will stop it manually.';
    }
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const response = await fetch('/api/unsubscribe', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ token }) });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || 'Could not update your preference.');
        document.querySelector('.unsubscribe-panel h1').textContent = 'Follow-ups stopped.';
        document.getElementById('unsubscribe-copy').textContent = 'No more automated messages will be sent for this enquiry.';
        button.hidden = true;
      } catch (error) {
        button.disabled = false;
        document.getElementById('unsubscribe-error').textContent = error.message;
      }
    });
  </script>
</body>
</html>
