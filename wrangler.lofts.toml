name = "lofts-studio-recovery"
main = "cloudflare-recovery-worker.js"
compatibility_date = "2026-11-05"
compatibility_flags = ["nodejs_compat", "nodejs_compat_populate_process_env"]
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
SITE_URL = "https://lofts.studio"

[[routes]]
pattern = "lofts.studio/*"
zone_name = "lofts.studio"

[[routes]]
pattern = "www.lofts.studio/*"
zone_name = "lofts.studio"

[triggers]
crons = ["0 3 * * *", "30 3 * * *", "15 2 * * *"]
